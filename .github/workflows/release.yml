name: Release Windows

# Dispara ao empurrar uma tag: git tag v0.0.1 && git push origin v0.0.1
on:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    name: Instalador NSIS
    # Obrigatoriamente windows-latest: better-sqlite3 (e depois sharp e
    # ffmpeg-static) são nativos e baixam/compilam binários da plataforma em
    # que o npm install roda. Build cruzado no Linux empacotaria binários de
    # Linux dentro do .exe.
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: Checagem de tipos
        run: npm run typecheck

      # Construir e publicar são passos separados de propósito. Antes eram um
      # só, e quando o upload do .exe de 122 MB falhou sobrou um release
      # PUBLICADO sem instalador — e o artefato nem chegou a ser salvo, porque
      # vinha depois. Agora o instalador é garantido antes de qualquer upload.
      # --publish never é obrigatório aqui. Sem a opção explícita o
      # electron-builder usa "onTagOrDraft" e, estando numa tag, publica
      # sozinho já neste passo — foi assim que a v0.0.3 falhou no upload e
      # derrubou o job antes de chegar na publicação com retentativa.
      - name: Gerar o instalador
        run: npm run empacotar:win --workspace @jjs/desktop

      - name: Guardar o instalador como artefato do build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: apps/desktop/release/*.exe
          if-no-files-found: error

      - name: Publicar no GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # O upload de um arquivo grande falha de vez em quando por rede.
          # Tentar de novo é bem melhor que deixar um release pela metade.
          for tentativa in 1 2 3; do
            echo "::group::Publicação — tentativa $tentativa"
            if npm run publicar:win --workspace @jjs/desktop; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Tentativa $tentativa falhou; esperando antes de repetir."
            sleep 20
          done
          echo "As três tentativas de publicação falharam."
          exit 1

      # Esta etapa existe porque já falhamos de três jeitos diferentes:
      # release publicado sem o .exe, build publicando cedo demais, e release
      # que simplesmente não aparece. Em vez de só conferir, ela **conserta**:
      # promove rascunho para publicado e, se faltar anexo, sobe o arquivo que
      # já está no disco. O `gh` vem pronto no runner.
      - name: Conferir e consertar o release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          tag="${GITHUB_REF_NAME}"
          pasta="apps/desktop/release"

          echo "Arquivos gerados:"
          ls -la "$pasta" || true

          # /releases/tags/ NÃO encontra rascunho, nem autenticado. Por isso a
          # busca é na lista completa, que com token inclui os rascunhos.
          achar() {
            gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name==\"$tag\") | {id, draft, assets: [.assets[].name]}" 2>/dev/null
          }

          info=$(achar)
          echo "Release encontrado: ${info:-nenhum}"

          if [ -z "$info" ]; then
            echo "Nenhum release para $tag. Criando com os arquivos do disco."
            gh release create "$tag" --title "$tag" --notes "Versão $tag" \
              "$pasta"/*.exe "$pasta"/latest.yml "$pasta"/*.blockmap
            info=$(achar)
          fi

          id=$(echo "$info" | jq -r .id)
          rascunho=$(echo "$info" | jq -r .draft)

          if [ "$rascunho" = "true" ]; then
            echo "Estava como rascunho — publicando, senão o auto-update não enxerga."
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/$id" -f draft=false >/dev/null
          fi

          # Garante os dois anexos que importam: o instalador e o manifesto do
          # auto-update. --clobber substitui o que estiver pela metade.
          for arquivo in "$pasta"/*.exe "$pasta"/latest.yml; do
            nome=$(basename "$arquivo")
            if ! echo "$info" | jq -e --arg n "$nome" '.assets | index($n)' >/dev/null; then
              echo "Faltava $nome — enviando."
              gh release upload "$tag" "$arquivo" --clobber
            fi
          done

          final=$(achar)
          echo "Estado final: $final"
          echo "$final" | jq -e '.draft == false' >/dev/null \
            || { echo "O release continua como rascunho."; exit 1; }
          echo "$final" | jq -e '.assets | map(select(endswith(".exe"))) | length > 0' >/dev/null \
            || { echo "O release está sem o instalador."; exit 1; }
          echo "$final" | jq -e '.assets | index("latest.yml")' >/dev/null \
            || { echo "O release está sem o latest.yml — o auto-update não funcionaria."; exit 1; }

          echo "Release $tag publicado, com instalador e latest.yml."
