name: Release Windows

# Dispara ao empurrar uma tag: git tag v0.0.1 && git push origin v0.0.1
on:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    name: Instalador NSIS
    # Obrigatoriamente windows-latest: better-sqlite3 (e depois sharp e
    # ffmpeg-static) são nativos e baixam/compilam binários da plataforma em
    # que o npm install roda. Build cruzado no Linux empacotaria binários de
    # Linux dentro do .exe.
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: Checagem de tipos
        shell: bash
        run: |
          # Sem o `2>&1` o tsc manda o erro para stderr e ele some no meio do
          # ruído do npm, dificultando o diagnóstico à distância.
          npm run typecheck 2>&1 | tee /tmp/typecheck.txt || {
            echo "::error::Falha na checagem de tipos. Erros:"
            grep -E "error TS" /tmp/typecheck.txt || true
            exit 1
          }

      # Construir e publicar são passos separados de propósito. Antes eram um
      # só, e quando o upload do .exe de 122 MB falhou sobrou um release
      # PUBLICADO sem instalador — e o artefato nem chegou a ser salvo, porque
      # vinha depois. Agora o instalador é garantido antes de qualquer upload.
      # Pela RAIZ, não pelo workspace: o build da raiz monta o app do
      # mecânico antes do desktop. Chamando o script do workspace, só o
      # Electron era construído e o instalador saía sem o app do celular —
      # o pareamento funcionava e o celular caía num 404 logo depois.
      - name: Construir o app do mecânico e o desktop
        run: npm run build

      # Sem isto o instalador sai silenciosamente incompleto: o
      # extraResources não reclama de uma pasta de origem que não existe.
      - name: Conferir que o app do mecânico foi construído
        shell: bash
        run: |
          test -f apps/mobile/dist/index.html || {
            echo "::error::apps/mobile/dist não foi construído."
            exit 1
          }
          echo "App do mecânico pronto:"
          ls apps/mobile/dist

      # --publish never é obrigatório aqui. Sem a opção explícita o
      # electron-builder usa "onTagOrDraft" e, estando numa tag, publica
      # sozinho já neste passo — foi assim que a v0.0.3 falhou no upload e
      # derrubou o job antes de chegar na publicação com retentativa.
      - name: Gerar o instalador
        run: npm run empacotar:win --workspace @jjs/desktop

      - name: Guardar o instalador como artefato do build
        # `success()` e não `always()`: com o build pulado por uma falha
        # anterior não há .exe, e o passo falhava de novo — escondendo a causa
        # real atrás de um segundo erro.
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: apps/desktop/release/*.exe
          if-no-files-found: error

      # A publicação é feita pelo `gh`, não pelo electron-builder.
      #
      # O electron-builder relatou sucesso três vezes deixando o release
      # incompleto: ele considera o upload feito quando termina de mandar os
      # bytes, mas o GitHub ainda precisa confirmar. Um anexo que não completa
      # fica com o nome lá e some depois — foi assim que a v0.0.5 saiu com
      # apenas o .blockmap, com o job todo verde.
      - name: Publicar no GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          tag="${GITHUB_REF_NAME}"
          pasta="apps/desktop/release"

          echo "Arquivos gerados:"
          ls -la "$pasta"

          exe=$(ls "$pasta"/*.exe 2>/dev/null | head -1)
          test -n "$exe" || { echo "::error::Instalador .exe não encontrado."; exit 1; }
          test -f "$pasta/latest.yml" || {
            echo "::error::latest.yml não foi gerado — o auto-update não funcionaria."
            exit 1
          }

          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "$tag" --notes "Versão $tag"

          # Sobe um anexo e só aceita quando o GitHub confirma o recebimento.
          subir() {
            arquivo="$1"
            nome=$(basename "$arquivo")

            for tentativa in 1 2 3; do
              echo "::group::$nome — tentativa $tentativa"
              gh release upload "$tag" "$arquivo" --clobber || true

              estado=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$tag" \
                --jq ".assets[] | select(.name==\"$nome\") | .state" 2>/dev/null || true)
              echo "estado no GitHub: ${estado:-ausente}"
              echo "::endgroup::"

              [ "$estado" = "uploaded" ] && return 0
              sleep 15
            done
            return 1
          }

          for arquivo in "$exe" "$pasta/latest.yml" "$pasta"/*.blockmap; do
            [ -f "$arquivo" ] || continue
            subir "$arquivo" || {
              echo "::error::Falhou ao enviar $(basename "$arquivo") depois de 3 tentativas."
              exit 1
            }
          done

          echo "EXE_NOME=$(basename "$exe")" >> "$GITHUB_ENV"

      # A prova final não é a API dizer que está lá, e sim o arquivo baixar.
      # É isso que a oficina vai fazer.
      - name: Conferir que o instalador realmente baixa
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          tag="${GITHUB_REF_NAME}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"

          for nome in "$EXE_NOME" latest.yml; do
            codigo=$(curl -sIL -o /dev/null -w "%{http_code}" --max-time 120 "$base/$nome")
            echo "$nome -> HTTP $codigo"
            [ "$codigo" = "200" ] || {
              echo "::error::$nome não está baixável no release $tag."
              exit 1
            }
          done

          rascunho=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$tag" --jq .draft)
          [ "$rascunho" = "false" ] || {
            echo "::error::O release $tag ficou como rascunho — o auto-update não o enxerga."
            exit 1
          }

          echo "Release $tag publicado, com instalador e latest.yml baixáveis."
