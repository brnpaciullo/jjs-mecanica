name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verificar:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Testes
        run: npm test

      # Só confere que o bundle compila. O instalador .exe nunca sai daqui:
      # os módulos nativos precisam ser compilados no Windows (ver release.yml).
      - name: Build
        run: npm run build
